        // HELPER FUNCTIONS: 5D ORBIT MATH, SAFE DISPOSAL, IFRAME-SAFE CLIPBOARD
        // =========================================================================
        function computeTiltedOrbitPoint(center, radius, angle, tiltX, tiltZ, outVec) {
            const x0 = Math.cos(angle) * radius;
            const z0 = Math.sin(angle) * radius;
            const y1 = -z0 * Math.sin(tiltX);
            const z1 = z0 * Math.cos(tiltX);
            const x2 = x0 * Math.cos(tiltZ) - y1 * Math.sin(tiltZ);
            const y2 = x0 * Math.sin(tiltZ) + y1 * Math.cos(tiltZ);
            outVec.set(center.x + x2, center.y + y2, center.z + z1);
            return outVec;
        }

        /**
         * Safely removes all CSS2DObjects (and their DOM pills) + disposes all WebGL
         * geometries/materials inside graphGroup WITHOUT ever wiping labelRenderer.domElement!
         */
        function disposeGraphGroupCleanly(group) {
            const cssObjects = [];
            group.traverse((obj) => {
                if (obj.isCSS2DObject) cssObjects.push(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m && m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            cssObjects.forEach(lbl => {
                if (lbl.element && lbl.element.parentNode) {
                    lbl.element.parentNode.removeChild(lbl.element);
                }
                if (lbl.parent) lbl.parent.remove(lbl);
            });
            while (group.children.length > 0) {
                group.remove(group.children[0]);
            }
        }

                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                return true;
            } catch (err) {
                return false;
            }
        }

                    const starGeo = new THREE.BufferGeometry();
                    const starPositions = new Float32Array(starCount * 3);
                    const starVelocities = new Float32Array(starCount * 3);
                    for (let i = 0; i < starCount; i++) {
                        starPositions[i * 3] = (Math.random() - 0.5) * 190;
                        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 190;
                        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 190;
                        starVelocities[i * 3] = (Math.random() - 0.5) * 0.45;
                        starVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.45;
                        starVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.45;
                    }
                    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                    const starPoints = new THREE.Points(
                        starGeo,
                        new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.26, transparent: true, opacity: 0.58 })
                    );
                    scene.add(starPoints);

                    // =====================================================================
                    // ARTICULATED 3D COMPANION CONSTRUCTION BOT: "RIFTBOT"
                    // =====================================================================
                    const botGroup = new THREE.Group();
                    scene.add(botGroup);

                    const chassisMat = new THREE.MeshStandardMaterial({
                        color: 0x1e293b, emissive: 0x0284c7, emissiveIntensity: 0.25, roughness: 0.25, metalness: 0.78
                    });
                    const trimCyanMat = new THREE.MeshStandardMaterial({
                        color: 0x22d3ee, emissive: 0x06b6d4, emissiveIntensity: 0.65, roughness: 0.2, metalness: 0.6
                    });
                    const visorDarkMat = new THREE.MeshStandardMaterial({
                        color: 0x020617, roughness: 0.1, metalness: 0.9
                    });

                    // Rounded Metallic Torso Chassis
                    const torsoBody = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.34, 0.64, 24), chassisMat);
                    const torsoBand = new THREE.Mesh(new THREE.TorusGeometry(0.41, 0.045, 10, 32), trimCyanMat);
                    torsoBand.rotation.x = Math.PI / 2;
                    torsoBand.position.y = 0.08;
                    const chestCore = new THREE.Mesh(
                        new THREE.OctahedronGeometry(0.13, 0),
                        new THREE.MeshBasicMaterial({ color: 0x34d399 })
                    );
                    chestCore.position.set(0, 0.06, 0.4);
                    botGroup.add(torsoBody, torsoBand, chestCore);

                    // Rounded Head Dome & Dark Glass Faceplate Visor
                    const headGroup = new THREE.Group();
                    headGroup.position.set(0, 0.62, 0);
                    const headDome = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), chassisMat);
                    headDome.scale.set(1.06, 0.92, 1.0);
                    const visorPlate = new THREE.Mesh(new THREE.SphereGeometry(0.37, 20, 16, -Math.PI * 0.36, Math.PI * 0.72, Math.PI * 0.28, Math.PI * 0.42), visorDarkMat);
                    visorPlate.position.set(0, 0.02, 0.09);
                    visorPlate.rotation.y = Math.PI / 2;
                    headGroup.add(headDome, visorPlate);

                    // Expressive LED Visor Eyes (Normal Blinking LEDs + Happy Arc Eyes + Focused Amber Weld Visor)
                    const eyeLedMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
                    const leftLedEye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), eyeLedMat);
                    leftLedEye.scale.set(0.95, 1.25, 0.5);
                    leftLedEye.position.set(-0.14, 0.04, 0.41);
                    const rightLedEye = leftLedEye.clone();
                    rightLedEye.position.x = 0.14;

                    // Happy Curved Arc Eyes (for Wave Hi Greeting)
                    const happyEyeMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
                    const leftHappyArc = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.024, 8, 16, Math.PI), happyEyeMat);
                    leftHappyArc.position.set(-0.14, 0.01, 0.42);
                    const rightHappyArc = leftHappyArc.clone();
                    rightHappyArc.position.x = 0.14;
                    leftHappyArc.visible = false;
                    rightHappyArc.visible = false;

                    // Focused Amber Welding Visor Bar (when firing plasma construction beam)
                    const weldVisorBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.42, 0.09, 0.04),
                        new THREE.MeshBasicMaterial({ color: 0xf59e0b })
                    );
                    weldVisorBar.position.set(0, 0.04, 0.43);
                    weldVisorBar.visible = false;

                    headGroup.add(leftLedEye, rightLedEye, leftHappyArc, rightHappyArc, weldVisorBar);

                    // Rotating Radar Dish Antenna on Head
                    const radarPivot = new THREE.Group();
                    radarPivot.position.set(0, 0.4, 0);
                    const radarMast = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.032, 0.24, 8), trimCyanMat);
                    radarMast.position.y = 0.1;
                    const radarDish = new THREE.Mesh(
                        new THREE.SphereGeometry(0.16, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.48),
                        new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.2, side: THREE.DoubleSide })
                    );
                    radarDish.position.set(0, 0.24, 0.04);
                    radarDish.rotation.x = Math.PI * 0.72;
                    const radarBeacon = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), new THREE.MeshBasicMaterial({ color: 0x34d399 }));
                    radarBeacon.position.set(0, 0.28, 0.1);
                    radarPivot.add(radarMast, radarDish, radarBeacon);
                    headGroup.add(radarPivot);
                    botGroup.add(headGroup);

                    // Articulated Left Arm (Waves Hi!)
                    const leftArmPivot = new THREE.Group();
                    leftArmPivot.position.set(-0.46, 0.22, 0.05);
                    const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), trimCyanMat);
                    const leftForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.46, 12), chassisMat);
                    leftForearm.position.set(0, -0.24, 0);
                    const leftClaw = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.022, 8, 16, Math.PI * 1.45), trimCyanMat);
                    leftClaw.position.set(0, -0.5, 0);
                    leftClaw.rotation.z = Math.PI * 0.78;
                    leftArmPivot.add(leftShoulder, leftForearm, leftClaw);
                    botGroup.add(leftArmPivot);

                    // Articulated Right Construction Arm with Plasma Welder Nozzle
                    const rightArmPivot = new THREE.Group();
                    rightArmPivot.position.set(0.46, 0.22, 0.05);
                    const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), trimCyanMat);
                    const rightForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.06, 0.44, 12), chassisMat);
                    rightForearm.position.set(0, -0.22, 0);
                    const welderNozzle = new THREE.Mesh(
                        new THREE.ConeGeometry(0.085, 0.22, 12),
                        new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.65, metalness: 0.7 })
                    );
                    welderNozzle.position.set(0, -0.52, 0.05);
                    welderNozzle.rotation.x = Math.PI;
                    const nozzleTip = new THREE.Object3D();
                    nozzleTip.position.set(0, -0.64, 0.05);
                    rightArmPivot.add(rightShoulder, rightForearm, welderNozzle, nozzleTip);
                    botGroup.add(rightArmPivot);

                    // Glowing Cyan Thruster Ring & Pulsing Exhaust Cone Beneath Body
                    const thrusterRing = new THREE.Mesh(
                        new THREE.TorusGeometry(0.32, 0.055, 10, 28),
                        new THREE.MeshBasicMaterial({ color: 0x22d3ee })
                    );
                    thrusterRing.rotation.x = Math.PI / 2;
                    thrusterRing.position.y = -0.38;
                    const thrusterGlow = new THREE.Mesh(
                        new THREE.ConeGeometry(0.28, 0.65, 16, 1, true),
                        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.42, side: THREE.DoubleSide })
                    );
                    thrusterGlow.position.y = -0.72;
                    thrusterGlow.rotation.x = Math.PI;
                    botGroup.add(thrusterRing, thrusterGlow);

                    // RiftBot Construction Laser Beam (Dual Core + Outer Glow)
                    const laserCoreGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const laserCore = new THREE.Line(laserCoreGeo, new THREE.LineBasicMaterial({ color: 0xfef08a }));
                    laserCore.visible = false;
                    scene.add(laserCore);

                    const laserGlowGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const laserGlow = new THREE.Line(laserGlowGeo, new THREE.LineBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.85 }));
                    laserGlow.visible = false;
                    scene.add(laserGlow);

                    // Real-Time 3D Welding Sparks Particle Fountain (32 orange/gold sparks with gravity + fade)
                    const SPARK_COUNT = 32;
                    const sparkMeshes = [];
                    const sparkGeo = new THREE.OctahedronGeometry(0.085, 0);
                    for (let i = 0; i < SPARK_COUNT; i++) {
                        const sMat = new THREE.MeshBasicMaterial({
                            color: i % 2 === 0 ? 0xfbbf24 : 0xf97316,
                            transparent: true,
                            opacity: 0
                        });
                        const sm = new THREE.Mesh(sparkGeo, sMat);
                        sm.visible = false;
                        scene.add(sm);
                        sparkMeshes.push({
                            mesh: sm,
                            vel: new THREE.Vector3(),
                            life: 0,
                            maxLife: 0.6
                        });
                    }

                    const store = {
                        scene, camera, renderer, labelRenderer, controls, coreGroup, graphGroup,
                        sectorMeshes: {}, keywordMeshes: {},
                        orbitMolecules: [],
                        dynamicLinks: [],
                        burstSubAtoms: [],
                        burstShellGroups: [],
                        staticPulses: [],
                        rippleWaves: [],
                        constructRings: [],
                        clickableObjects: [],
                        labelEntries: [],
                        orbitTime: 0,
                        // Smooth Camera Fly-To state
                        camFly: { active: false, targetPos: new THREE.Vector3(), targetLook: new THREE.Vector3() },
                        // RiftBot State & Parts
                        botGroup, headGroup, radarPivot, leftArmPivot, rightArmPivot, nozzleTip,
                        leftLedEye, rightLedEye, leftHappyArc, rightHappyArc, weldVisorBar, thrusterGlow,
                        laserCore, laserGlow, sparkMeshes,
                        botState: {
                            mode: 'greeting', // greeting | constructing | patrolling | docked
                            timer: 0,
                            duration: 5.5,
                            targetMesh: null,
                            secondaryMesh: null,
                            patrolCooldown: 1.5,
                            ringSpawnTimer: 0
                        }
                    };
                    sceneRefs.current = store;

                    // Cancel auto camera fly-to if user manually grabs OrbitControls
                    onControlStart = () => {
                        store.camFly.active = false;
                    };
                    controls.addEventListener('start', onControlStart);

                    // Raycaster with 220ms Single vs Double Click Debouncing
                    const raycaster = new THREE.Raycaster();
                    const mouseVec = new THREE.Vector2();
                    const pickHit = (clientX, clientY) => {
                        mouseVec.x = (clientX / window.innerWidth) * 2 - 1;
                        mouseVec.y = -(clientY / window.innerHeight) * 2 + 1;
                        raycaster.setFromCamera(mouseVec, camera);
                        const hits = raycaster.intersectObjects(store.clickableObjects, false);
                        return hits.length > 0 ? hits[0].object : null;
                    };

                    onClick = (e) => {
                        const hit = pickHit(e.clientX, e.clientY);
                        if (!hit) return;
                        if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
                        clickTimerRef.current = setTimeout(() => {
                            if (hit.userData.type === 'keyword') {
                                latestProps.current.onSelectAndBurstKeyword(hit.userData.id, false);
                            } else if (hit.userData.type === 'sector') {
                                latestProps.current.onSelectSector(hit.userData.id);
                            }
                        }, 220);
                    };

                    onDblClick = (e) => {
                        if (clickTimerRef.current) {
                            clearTimeout(clickTimerRef.current);
                            clickTimerRef.current = null;
                        }
                        const hit = pickHit(e.clientX, e.clientY);
                        if (!hit) return;
                        if (hit.userData.type === 'sector') {
                            latestProps.current.onToggleSectorBurst(hit.userData.id, null);
                        } else if (hit.userData.type === 'keyword') {
                            latestProps.current.onSelectAndBurstKeyword(hit.userData.id, true);
                        }
                    };

                    renderer.domElement.addEventListener('click', onClick);
                    renderer.domElement.addEventListener('dblclick', onDblClick);

                    onResize = () => {
                        const w = window.innerWidth;
                        const h = window.innerHeight;
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();
                        renderer.setSize(w, h);
                        labelRenderer.setSize(w, h);
                    };
                    window.addEventListener('resize', onResize);

                    const clock = new THREE.Clock();
                    const nozzleWorldPos = new THREE.Vector3();
                    const weldPoint = new THREE.Vector3();
                    let telemetryTimer = 0;

                    const spawnEmeraldConstructRing = (pos) => {
                        const ring = new THREE.Mesh(
                            new THREE.TorusGeometry(0.65, 0.045, 8, 28),
                            new THREE.MeshBasicMaterial({ color: 0x34d399, wireframe: true, transparent: true, opacity: 0.95 })
                        );
                        ring.position.copy(pos);
                        scene.add(ring);
                        store.constructRings.push({ mesh: ring, elapsed: 0, duration: 1.15 });
                    };

                    const emitSparksAt = (origin, dt) => {
                        sparkMeshes.forEach((sp) => {
                            if (sp.life <= 0) {
                                if (Math.random() < 0.35) {
                                    sp.life = 0.45 + Math.random() * 0.42;
                                    sp.maxLife = sp.life;
                                    sp.mesh.position.copy(origin);
                                    sp.vel.set(
                                        (Math.random() - 0.5) * 7.5,
                                        (Math.random() * 4.5) + 1.0,
                                        (Math.random() - 0.5) * 7.5
                                    );
                                    sp.mesh.visible = true;
                                }
                            } else {
                                sp.life -= dt;
                                sp.vel.y -= 9.2 * dt; // Gravity
                                sp.mesh.position.addScaledVector(sp.vel, dt);
                                sp.mesh.rotation.x += dt * 8;
                                sp.mesh.rotation.y += dt * 10;
                                const ratio = Math.max(0, sp.life / sp.maxLife);
                                sp.mesh.material.opacity = ratio;
                                sp.mesh.scale.setScalar(0.5 + ratio * 0.9);
                                if (sp.life <= 0) sp.mesh.visible = false;
                            }
                        });
                    };

                    const animate = () => {
                        frameId = requestAnimationFrame(animate);
                        const dt = Math.min(clock.getDelta(), 0.05);
                        const elapsed = clock.getElapsedTime();

                        if (latestProps.current.orbitsEnabled) {
                            store.orbitTime += dt;
                        }
                        const oTime = store.orbitTime;

                        // Smooth Camera Fly-To Interpolation
                        if (store.camFly.active) {
                            camera.position.lerp(store.camFly.targetPos, 0.065);
                            controls.target.lerp(store.camFly.targetLook, 0.085);
                            if (camera.position.distanceTo(store.camFly.targetPos) < 0.35 && controls.target.distanceTo(store.camFly.targetLook) < 0.2) {
                                store.camFly.active = false;
                            }
                        }

                        // Rotate 5D Synapse Core
                        coreGroup.rotation.y += dt * 0.44;
                        coreGroup.children[2].rotation.z += dt * 0.82;
                        coreGroup.children[3].rotation.y -= dt * 0.65;

                        // Rotate Macro Sector Nuclei
                        Object.values(store.sectorMeshes).forEach((m, idx) => {
                            m.rotation.y += dt * (0.26 + (idx % 4) * 0.05);
                            m.rotation.x = Math.sin(elapsed * 0.55 + idx) * 0.1;
                        });

                        // 1) REVOLVE MOLECULES AROUND MACRO SECTOR NUCLEI + LIVE TETHER BOND RODS
                        store.orbitMolecules.forEach((om) => {
                            const angle = om.baseAngle + oTime * om.speed;
                            computeTiltedOrbitPoint(om.center, om.radius, angle, om.tiltX, om.tiltZ, om.mesh.position);
                            om.mesh.rotation.y += dt * 0.65;
                            if (om.halo) om.halo.rotation.z += dt * 1.15;

                            if (om.tetherLine) {
                                const arr = om.tetherLine.geometry.attributes.position.array;
                                arr[0] = om.center.x; arr[1] = om.center.y; arr[2] = om.center.z;
                                arr[3] = om.mesh.position.x; arr[4] = om.mesh.position.y; arr[5] = om.mesh.position.z;
                                om.tetherLine.geometry.attributes.position.needsUpdate = true;
                            }
                        });

                        // 2) LIVE NARRATIVE CHAIN BONDS & CROSS-MOLECULE BRIDGES + SYNAPTIC PULSES
                        store.dynamicLinks.forEach((dl) => {
                            const pA = dl.fromMesh.position;
                            const pB = dl.toMesh.position;
                            const arr = dl.line.geometry.attributes.position.array;
                            arr[0] = pA.x; arr[1] = pA.y; arr[2] = pA.z;
                            arr[3] = pB.x; arr[4] = pB.y; arr[5] = pB.z;
                            dl.line.geometry.attributes.position.needsUpdate = true;

                            if (dl.pulseMesh) {
                                dl.pulseElapsed += dt;
                                const p = (dl.pulseElapsed % dl.pulseDuration) / dl.pulseDuration;
                                dl.pulseMesh.position.lerpVectors(pA, pB, p);
                            }
                        });

                        // 3) REVOLVING GOLDEN-AMBER DUPLICATE SUB-ATOMS AROUND BURSTED MOLECULES
                        store.burstShellGroups.forEach((bsg) => {
                            bsg.group.position.copy(bsg.parentMesh.position);
                            bsg.group.rotation.y += dt * 0.5;
                        });
                        store.burstSubAtoms.forEach((sa) => {
                            const parentPos = sa.parentMesh.position;
                            const subAngle = sa.baseAngle + oTime * sa.speed;
                            computeTiltedOrbitPoint(parentPos, sa.radius, subAngle, sa.tiltX, sa.tiltZ, sa.mesh.position);
                            sa.mesh.rotation.y += dt * 1.8;
                            sa.mesh.rotation.x += dt * 1.1;

                            const arr = sa.bondLine.geometry.attributes.position.array;
                            arr[0] = parentPos.x; arr[1] = parentPos.y; arr[2] = parentPos.z;
                            arr[3] = sa.mesh.position.x; arr[4] = sa.mesh.position.y; arr[5] = sa.mesh.position.z;
                            sa.bondLine.geometry.attributes.position.needsUpdate = true;
                        });

                        // 4) STATIC PULSES (Core -> Sector & Sector <-> Sector Bridges)
                        store.staticPulses.forEach((sp) => {
                            sp.elapsed += dt;
                            const p = (sp.elapsed % sp.duration) / sp.duration;
                            sp.mesh.position.lerpVectors(sp.from, sp.to, p);
                        });

                        // 5) DISTANCE-AWARE OPACITY SCALING ON 3D FLOATING LABELS
                        store.labelEntries.forEach((entry) => {
                            const dist = camera.position.distanceTo(entry.obj.position);
                            const maxDist = entry.priority ? 96 : 64;
                            const minOp = entry.priority ? 0.44 : 0.16;
                            const opacity = Math.max(minOp, Math.min(1, 1.38 - dist / maxDist));
                            entry.div.style.opacity = opacity.toFixed(2);
                        });

                        // 6) EXPANDING RIPPLE WAVES & EMERALD WIREFRAME CONSTRUCTION RINGS
                        for (let i = store.rippleWaves.length - 1; i >= 0; i--) {
                            const rw = store.rippleWaves[i];
                            rw.elapsed += dt;
                            const p = Math.min(1, rw.elapsed / rw.duration);
                            if (rw.targetMesh) rw.mesh.position.copy(rw.targetMesh.position);
                            rw.mesh.scale.setScalar(1 + p * 4.6);
                            rw.mesh.lookAt(camera.position);
                            rw.mesh.material.opacity = Math.max(0, (1 - p) * 0.88);
                            if (p >= 1) {
                                scene.remove(rw.mesh);
                                rw.mesh.geometry.dispose();
                                rw.mesh.material.dispose();
                                store.rippleWaves.splice(i, 1);
                            }
                        }

                        for (let i = store.constructRings.length - 1; i >= 0; i--) {
                            const cr = store.constructRings[i];
                            cr.elapsed += dt;
                            const p = Math.min(1, cr.elapsed / cr.duration);
                            cr.mesh.scale.setScalar(1 + p * 2.9);
                            cr.mesh.rotation.x += dt * 2.5;
                            cr.mesh.rotation.y += dt * 3.2;
                            cr.mesh.material.opacity = Math.max(0, (1 - p) * 0.95);
                            if (p >= 1) {
                                scene.remove(cr.mesh);
                                cr.mesh.geometry.dispose();
                                cr.mesh.material.dispose();
                                store.constructRings.splice(i, 1);
                            }
                        }

                        // 7) 5D STARFIELD DRIFT
                        const posAttr = starGeo.getAttribute('position');
                        for (let i = 0; i < starCount; i++) {
                            const i3 = i * 3;
                            posAttr.array[i3] += starVelocities[i3] * dt;
                            posAttr.array[i3 + 1] += starVelocities[i3 + 1] * dt;
                            posAttr.array[i3 + 2] += starVelocities[i3 + 2] * dt;
                            if (posAttr.array[i3] > 95) posAttr.array[i3] = -95;
                            if (posAttr.array[i3] < -95) posAttr.array[i3] = 95;
                        }
                        posAttr.needsUpdate = true;

                        // 8) ARTICULATED 3D RIFTBOT ANIMATION ENGINE
                        botGroup.visible = latestProps.current.riftBotVisible;
                        radarPivot.rotation.y += dt * 3.2;
                        thrusterGlow.scale.set(1, 0.8 + Math.sin(elapsed * 20) * 0.25, 1);
                        thrusterGlow.material.opacity = 0.35 + Math.sin(elapsed * 18) * 0.14;

                        // Periodic eye blink
                        const blinkCycle = elapsed % 4.2;
                        const isBlinking = blinkCycle > 4.04;
                        leftLedEye.scale.y = isBlinking ? 0.12 : 1.25;
                        rightLedEye.scale.y = isBlinking ? 0.12 : 1.25;

                        const bs = store.botState;
                        let isFiringLaser = false;

                        if (botGroup.visible) {
                            if (bs.mode === 'greeting') {
                                bs.timer += dt;
                                // Fly near camera lower-right view and wave hi!
                                const vec = new THREE.Vector3(0.42, -0.18, 0.5).unproject(camera);
                                const dir = vec.sub(camera.position).normalize();
                                const greetPos = camera.position.clone().add(dir.multiplyScalar(11.5));
                                greetPos.y += Math.sin(elapsed * 4.5) * 0.24;
                                botGroup.position.lerp(greetPos, 0.12);
                                botGroup.lookAt(camera.position);
                                botGroup.scale.setScalar(1.05);

                                // Happy arc eyes + enthusiastic left arm wave!
                                leftLedEye.visible = false;
                                rightLedEye.visible = false;
                                leftHappyArc.visible = true;
                                rightHappyArc.visible = true;
                                weldVisorBar.visible = false;

                                leftArmPivot.rotation.z = -2.45 + Math.sin(elapsed * 13) * 0.45;
                                leftArmPivot.rotation.x = 0.2;
                                rightArmPivot.rotation.z = 0.25;
                                rightArmPivot.rotation.x = Math.sin(elapsed * 3) * 0.15;

                                if (bs.timer >= bs.duration) {
                                    bs.mode = 'patrolling';
                                    bs.timer = 0;
                                    latestProps.current.onBotStateChange('patrolling', 'Greeting complete! Entering autonomous 5D vertex patrol...');
                                }
                            } else if (bs.mode === 'docked') {
                                // Hover calmly near bottom-right above RiftBot HUD card
                                const ndcX = ((window.innerWidth - 185) / window.innerWidth) * 2 - 1;
                                const ndcY = -((window.innerHeight - 285) / window.innerHeight) * 2 + 1;
                                const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
                                const dir = vec.sub(camera.position).normalize();
                                const dockPos = camera.position.clone().add(dir.multiplyScalar(13.0));
                                dockPos.y += Math.sin(elapsed * 3.2) * 0.18;
                                botGroup.position.lerp(dockPos, 0.12);
                                botGroup.lookAt(camera.position);
                                botGroup.scale.setScalar(0.95);

                                leftLedEye.visible = true;
                                rightLedEye.visible = true;
                                leftHappyArc.visible = false;
                                rightHappyArc.visible = false;
                                weldVisorBar.visible = false;

                                leftArmPivot.rotation.set(0, 0, -0.2 + Math.sin(elapsed * 2.5) * 0.08);
                                rightArmPivot.rotation.set(0, 0, 0.2 - Math.sin(elapsed * 2.5) * 0.08);
                            } else if (bs.mode === 'constructing' && bs.targetMesh) {
                                bs.timer += dt;
                                bs.ringSpawnTimer += dt;
                                botGroup.scale.setScalar(0.88);

                                // Determine live weld point (between two bridge nodes or orbiting single node)
                                if (bs.secondaryMesh) {
                                    const tBridge = (Math.sin(elapsed * 2.1) + 1) * 0.5;
                                    weldPoint.lerpVectors(bs.targetMesh.position, bs.secondaryMesh.position, tBridge);
                                } else {
                                    weldPoint.copy(bs.targetMesh.position);
                                }

                                // Orbit closely around the construction target
                                const orbAng = elapsed * 2.2;
                                const desiredPos = new THREE.Vector3(
                                    weldPoint.x + Math.cos(orbAng) * 2.6,
                                    weldPoint.y + 1.35 + Math.sin(elapsed * 4.5) * 0.35,
                                    weldPoint.z + Math.sin(orbAng) * 2.6
                                );
                                botGroup.position.lerp(desiredPos, 0.14);
                                botGroup.lookAt(weldPoint);

                                // Focused Amber Welding Visor + Extended Welder Arm
                                leftLedEye.visible = false;
                                rightLedEye.visible = false;
                                leftHappyArc.visible = false;
                                rightHappyArc.visible = false;
                                weldVisorBar.visible = true;

                                rightArmPivot.rotation.set(-1.15 + Math.sin(elapsed * 18) * 0.08, 0, 0.18);
                                leftArmPivot.rotation.set(-0.55, 0, -0.35);

                                // Fire Construction Laser Beam + Welding Sparks Particle Fountain
                                if (botGroup.position.distanceTo(desiredPos) < 4.5) {
                                    isFiringLaser = true;
                                    nozzleTip.getWorldPosition(nozzleWorldPos);
                                    laserCore.geometry.setFromPoints([nozzleWorldPos, weldPoint]);
                                    const jitter = new THREE.Vector3((Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.14);
                                    laserGlow.geometry.setFromPoints([nozzleWorldPos, weldPoint.clone().add(jitter)]);
                                    emitSparksAt(weldPoint, dt);

                                    if (bs.ringSpawnTimer > 0.72) {
                                        bs.ringSpawnTimer = 0;
                                        spawnEmeraldConstructRing(weldPoint);
                                    }
                                }

                                if (bs.timer >= bs.duration) {
                                    bs.mode = 'patrolling';
                                    bs.timer = 0;
                                    bs.targetMesh = null;
                                    bs.secondaryMesh = null;
                                    latestProps.current.onBotStateChange('patrolling', 'Vertex construction verified! Resuming autonomous 5D patrol.');
                                }
                            } else {
                                // Autonomous 3D Patrol: visits random nodes & performs quick vertex welds
                                bs.patrolCooldown -= dt;
                                botGroup.scale.setScalar(0.84);

                                leftLedEye.visible = true;
                                rightLedEye.visible = true;
                                leftHappyArc.visible = false;
                                rightHappyArc.visible = false;
                                weldVisorBar.visible = false;

                                if (!bs.targetMesh || bs.patrolCooldown <= 0) {
                                    const allTargets = [...Object.values(store.keywordMeshes), ...Object.values(store.sectorMeshes)];
                                    if (allTargets.length > 0) {
                                        bs.targetMesh = allTargets[Math.floor(Math.random() * allTargets.length)];
                                        bs.patrolCooldown = 5.5;
                                        bs.ringSpawnTimer = 0;
                                    }
                                }

                                if (bs.targetMesh) {
                                    const tPos = bs.targetMesh.position;
                                    const pAng = elapsed * 1.4;
                                    const hoverTarget = new THREE.Vector3(
                                        tPos.x + Math.cos(pAng) * 3.1,
                                        tPos.y + 1.5 + Math.sin(elapsed * 3.2) * 0.4,
                                        tPos.z + Math.sin(pAng) * 3.1
                                    );
                                    botGroup.position.lerp(hoverTarget, 0.055);
                                    botGroup.lookAt(tPos);

                                    const distToNode = botGroup.position.distanceTo(tPos);
                                    if (distToNode < 4.2 && bs.patrolCooldown < 3.2 && bs.patrolCooldown > 1.0) {
                                        // Quick autonomous vertex maintenance weld
                                        isFiringLaser = true;
                                        weldVisorBar.visible = true;
                                        leftLedEye.visible = false;
                                        rightLedEye.visible = false;
                                        rightArmPivot.rotation.set(-1.1, 0, 0.2);
                                        nozzleTip.getWorldPosition(nozzleWorldPos);
                                        laserCore.geometry.setFromPoints([nozzleWorldPos, tPos]);
                                        laserGlow.geometry.setFromPoints([nozzleWorldPos, tPos]);
                                        emitSparksAt(tPos, dt);
                                        bs.ringSpawnTimer += dt;
                                        if (bs.ringSpawnTimer > 0.9) {
                                            bs.ringSpawnTimer = 0;
                                            spawnEmeraldConstructRing(tPos);
                                        }
                                    } else {
                                        leftArmPivot.rotation.set(-0.3, 0, -0.35 + Math.sin(elapsed * 4) * 0.15);
                                        rightArmPivot.rotation.set(-0.3, 0, 0.35 - Math.sin(elapsed * 4) * 0.15);
                                    }
                                }
                            }
                        }

                        laserCore.visible = isFiringLaser;
                        laserGlow.visible = isFiringLaser;
                        if (!isFiringLaser) {
                            // Fade out remaining sparks naturally
                            sparkMeshes.forEach(sp => {
                                if (sp.life > 0) {
                                    sp.life -= dt;
                                    sp.vel.y -= 9.2 * dt;
                                    sp.mesh.position.addScaledVector(sp.vel, dt);
                                    sp.mesh.material.opacity = Math.max(0, sp.life / sp.maxLife);
                                    if (sp.life <= 0) sp.mesh.visible = false;
                                }
                            });
                        }

                        telemetryTimer += dt;
                        if (telemetryTimer > 0.35) {
                            telemetryTimer = 0;
                            latestProps.current.onUpdateBotTelemetry({
                                x: botGroup.position.x.toFixed(1),
                                y: botGroup.position.y.toFixed(1),
                                z: botGroup.position.z.toFixed(1),
                                laserOn: isFiringLaser
                            });
                        }

                        controls.update();
                        renderer.render(scene, camera);
                        labelRenderer.render(scene, camera);
                    };

                    animate();
                } catch (err) {
                    console.error('WebGL initialization error:', err);
                }

                return () => {
                    if (frameId) cancelAnimationFrame(frameId);
                    if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
                    if (sceneRefs.current?.graphGroup) disposeGraphGroupCleanly(sceneRefs.current.graphGroup);
                    if (controls && onControlStart) controls.removeEventListener('start', onControlStart);
                    if (renderer && renderer.domElement) {
                        if (onClick) renderer.domElement.removeEventListener('click', onClick);
                        if (onDblClick) renderer.domElement.removeEventListener('dblclick', onDblClick);
                        if (canvasRef.current && renderer.domElement.parentNode === canvasRef.current) {
                            canvasRef.current.removeChild(renderer.domElement);
                        }
                        renderer.dispose();
                    }
                    if (labelRenderer && labelRenderer.domElement && labelRef.current && labelRenderer.domElement.parentNode === labelRef.current) {
                        labelRef.current.removeChild(labelRenderer.domElement);
                    }
                    if (onResize) window.removeEventListener('resize', onResize);
                };
            }, []);

            // Rebuild 5D Molecular Graph inside dedicated graphGroup (NEVER wipes labelRenderer.domElement!)
            useEffect(() => {
                const store = sceneRefs.current;
                if (!store || !store.graphGroup) return;
                const { graphGroup } = store;

                disposeGraphGroupCleanly(graphGroup);

                store.sectorMeshes = {};
                store.keywordMeshes = {};
                store.orbitMolecules = [];
                store.dynamicLinks = [];
                store.burstSubAtoms = [];
                store.burstShellGroups = [];
                store.staticPulses = [];
                store.clickableObjects = [];
                store.labelEntries = [];

                const activeSectorIds = new Set(expandedSectors);
                if (selectedSectorId) activeSectorIds.add(selectedSectorId);
                const hasSelectionContext = activeSectorIds.size > 0;

                const connectedNeighborSectors = new Set();
                jaggardPairs.forEach(pair => {
                    if (pair.type === 'sector') {
                        if (activeSectorIds.has(pair.aId) && !activeSectorIds.has(pair.bId)) connectedNeighborSectors.add(pair.bId);
                        if (activeSectorIds.has(pair.bId) && !activeSectorIds.has(pair.aId)) connectedNeighborSectors.add(pair.aId);
                    }
                });

                const addLabel = (obj, htmlStr, yOffset = 1.5, priority = true, handlers = null) => {
                    const div = document.createElement('div');
                    div.innerHTML = htmlStr;
                    if (handlers) {
                        const pill = div.firstElementChild;
                        if (pill) {
                            pill.classList.add('label-pill');
                            pill.addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
                                clickTimerRef.current = setTimeout(() => handlers.onSingle?.(), 220);
                            });
                            pill.addEventListener('dblclick', (ev) => {
                                ev.stopPropagation();
                                if (clickTimerRef.current) {
                                    clearTimeout(clickTimerRef.current);
                                    clickTimerRef.current = null;
                                }
                                handlers.onDouble?.();
                            });
                        }
                    }
                    const lbl = new THREE.CSS2DObject(div);
                    lbl.position.set(0, yOffset, 0);
                    obj.add(lbl);
                    store.labelEntries.push({ obj, div, lbl, priority });
                };

                const n = Math.max(1, sectors.length);
                const tempInitPos = new THREE.Vector3();

                sectors.forEach((sec, idx) => {
                    const phi = Math.acos(-1 + (2 * idx) / n);
                    const theta = Math.sqrt(n * Math.PI) * phi;
                    const sphereRadius = 18.8;
                    const sx = sphereRadius * Math.cos(theta) * Math.sin(phi);
                    const sy = sphereRadius * Math.sin(theta) * Math.sin(phi) * 0.78;
                    const sz = sphereRadius * Math.cos(phi);
                    const secCenter = new THREE.Vector3(sx, sy, sz);

                    const isSelected = selectedSectorId === sec.id;
                    const isExpanded = expandedSectors.has(sec.id);
                    const isConnectedNeighbor = connectedNeighborSectors.has(sec.id);
                    const isDimmed = hasSelectionContext && !isSelected && !isExpanded && !isConnectedNeighbor;

                    let nodeRadius = 1.05;
                    let nodeColor = sec.color;
                    let emissiveIntensity = isDimmed ? 0.16 : 0.44;
                    if (isExpanded) {
                        nodeRadius = 1.48;
                        emissiveIntensity = 0.85;
                    } else if (isSelected) {
                        nodeRadius = 1.44;
                        emissiveIntensity = 0.78;
                    } else if (isConnectedNeighbor) {
                        nodeRadius = 1.38;
                        nodeColor = '#e879f9'; // Bright Magenta for LINKED cross-sector neighbors
                        emissiveIntensity = 0.92;
                    }

                    const mesh = new THREE.Mesh(
                        new THREE.IcosahedronGeometry(nodeRadius, 1),
                        new THREE.MeshStandardMaterial({
                            color: nodeColor,
                            emissive: nodeColor,
                            emissiveIntensity,
                            roughness: 0.24,
                            metalness: 0.46,
                            transparent: isDimmed,
                            opacity: isDimmed ? 0.5 : 1.0
                        })
                    );
                    mesh.position.copy(secCenter);
                    mesh.userData = { type: 'sector', id: sec.id };
                    graphGroup.add(mesh);
                    store.sectorMeshes[sec.id] = mesh;
                    store.clickableObjects.push(mesh);

                    if (isSelected || isExpanded || isConnectedNeighbor) {
                        const selRing = new THREE.Mesh(
                            new THREE.TorusGeometry(nodeRadius * 1.42, 0.055, 10, 36),
                            new THREE.MeshBasicMaterial({ color: isConnectedNeighbor ? 0xe879f9 : 0x22d3ee })
                        );
                        mesh.add(selRing);
                    }

                    const showMolecules = viewMode === 'orbiting100' || isExpanded;
                    const secKws = keywords.filter(k => k.sectorId === sec.id);

                    const shellTiltX = ((idx % 5) - 2) * 0.28 + 0.35;
                    const shellTiltZ = (((idx * 3) % 5) - 2) * 0.24;

                    if (showMolecules) {
                        const ringRadii = isExpanded ? [3.6, 5.1, 6.6] : [2.35, 3.15];
                        ringRadii.forEach((r, rIdx) => {
                            const orbitShell = new THREE.Mesh(
                                new THREE.TorusGeometry(r, isExpanded ? 0.032 : 0.018, 8, 56),
                                new THREE.MeshBasicMaterial({
                                    color: isExpanded ? 0x34d399 : nodeColor,
                                    transparent: true,
                                    opacity: isExpanded ? 0.45 : (isDimmed ? 0.12 : 0.28)
                                })
                            );
                            orbitShell.position.copy(secCenter);
                            orbitShell.rotation.order = 'ZYX';
                            orbitShell.rotation.set(Math.PI / 2 + shellTiltX, 0, shellTiltZ + (rIdx % 2 === 0 ? 0 : 0.22));
                            graphGroup.add(orbitShell);
                        });
                    } else {
                        const miniRing = new THREE.Mesh(
                            new THREE.TorusGeometry(nodeRadius * 1.58, 0.02, 8, 36),
                            new THREE.MeshBasicMaterial({ color: nodeColor, transparent: true, opacity: isDimmed ? 0.15 : 0.36 })
                        );
                        miniRing.position.copy(secCenter);
                        miniRing.rotation.set(Math.PI / 2 + shellTiltX, 0, shellTiltZ);
                        graphGroup.add(miniRing);
                    }

                    const badgeBorder = isConnectedNeighbor
                        ? 'border-fuchsia-400 bg-fuchsia-950/92'
                        : (isSelected || isExpanded)
                            ? 'border-cyan-300 bg-cyan-950/92'
                            : 'border-cyan-400/40 bg-slate-950/88';

                    addLabel(mesh, `
                        <div class="px-2.5 py-0.5 rounded-lg ${badgeBorder} border shadow-lg text-[10px] font-bold text-white whitespace-nowrap flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full" style="background:${nodeColor}"></span>
                            <span>${sec.shortName}</span>
                            <span class="font-mono text-[9px] text-cyan-300">(${secKws.length})</span>
                            ${isConnectedNeighbor ? '<span class="text-[8px] font-mono px-1 rounded bg-fuchsia-500/35 text-fuchsia-200 ml-0.5">LINKED</span>' : ''}
                            ${isExpanded ? '<span class="text-[8px] font-mono px-1 rounded bg-emerald-500/30 text-emerald-200 ml-0.5">CHAIN</span>' : ''}
                        </div>
                    `, nodeRadius + 0.62, true, {
                        onSingle: () => latestProps.current.onSelectSector(sec.id),
                        onDouble: () => latestProps.current.onToggleSectorBurst(sec.id, null)
                    });

                    // Core -> Sector synaptic beam + traveling light pulse
                    const coreToSecLine = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), secCenter]),
                        new THREE.LineBasicMaterial({
                            color: nodeColor,
                            transparent: true,
                            opacity: isSelected || isExpanded || isConnectedNeighbor ? 0.56 : (isDimmed ? 0.1 : 0.22)
                        })
                    );
                    graphGroup.add(coreToSecLine);

                    const coreOrb = new THREE.Mesh(
                        new THREE.SphereGeometry(0.14, 10, 10),
                        new THREE.MeshBasicMaterial({ color: nodeColor })
                    );
                    graphGroup.add(coreOrb);
                    store.staticPulses.push({
                        mesh: coreOrb,
                        from: new THREE.Vector3(0, 0, 0),
                        to: secCenter.clone(),
                        elapsed: idx * 0.16,
                        duration: 2.0
                    });

                    // REVOLVING 5D TREND MOLECULES AROUND SECTOR NUCLEUS
                    if (showMolecules) {
                        secKws.forEach((kw, kIdx) => {
                            const isPos = kw.deltaNum >= 0;
                            const isKwSelected = selectedKeywordId === kw.id;
                            const isBursted = burstKeywords.has(kw.id);

                            const orbitRadius = isExpanded
                                ? (3.5 + kIdx * 0.82)
                                : (2.25 + (kIdx % 3) * 0.52);
                            const baseAngle = (kIdx / Math.max(1, secKws.length)) * Math.PI * 2 + idx * 0.7;
                            const orbitSpeed = isExpanded
                                ? (0.32 - kIdx * 0.024) * (idx % 2 === 0 ? 1 : -1)
                                : (0.46 + (kIdx % 3) * 0.08) * (idx % 2 === 0 ? 1 : -1);
                            const localTiltX = shellTiltX + ((kIdx % 2 === 0) ? 0 : 0.24);
                            const localTiltZ = shellTiltZ + ((kIdx % 2 === 0) ? 0 : -0.18);

                            computeTiltedOrbitPoint(secCenter, orbitRadius, baseAngle + store.orbitTime * orbitSpeed, localTiltX, localTiltZ, tempInitPos);

                            const baseScale = Math.max(0.28, Math.min(0.62, 0.25 + (kw.currentVol / 75000) * 0.38));
                            const volScale = isExpanded ? baseScale * 1.38 : baseScale;

                            const molColor = isPos ? 0x22d3ee : 0xf43f5e;
                            const molEmissive = isPos ? 0x0284c7 : 0xbe123c;
                            const kMesh = new THREE.Mesh(
                                new THREE.SphereGeometry(volScale, 18, 18),
                                new THREE.MeshStandardMaterial({
                                    color: isBursted ? 0xf59e0b : molColor,
                                    emissive: isBursted ? 0xd97706 : molEmissive,
                                    emissiveIntensity: isExpanded || isKwSelected || isBursted ? 0.8 : (isDimmed ? 0.2 : 0.52),
                                    roughness: 0.22,
                                    metalness: 0.35
                                })
                            );

                            // Volume-scaled tilted orbital electron ring
                            const halo = new THREE.Mesh(
                                new THREE.TorusGeometry(volScale * 1.54, isExpanded ? 0.036 : 0.022, 8, 28),
                                new THREE.MeshBasicMaterial({
                                    color: isBursted ? 0xfbbf24 : (isPos ? 0x34d399 : 0xfb7185),
                                    transparent: true,
                                    opacity: isExpanded || isKwSelected ? 0.95 : 0.65
                                })
                            );
                            halo.rotation.x = Math.PI / 3;
                            kMesh.add(halo);

                            kMesh.position.copy(tempInitPos);
                            kMesh.userData = { type: 'keyword', id: kw.id };
                            graphGroup.add(kMesh);
                            store.keywordMeshes[kw.id] = kMesh;
                            store.clickableObjects.push(kMesh);

                            // Live-updating molecular tether bond
                            const tetherGeo = new THREE.BufferGeometry();
                            tetherGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                                secCenter.x, secCenter.y, secCenter.z,
                                tempInitPos.x, tempInitPos.y, tempInitPos.z
                            ]), 3));
                            const tetherLine = new THREE.Line(
                                tetherGeo,
                                new THREE.LineBasicMaterial({
                                    color: isExpanded ? 0x38bdf8 : sec.color,
                                    transparent: true,
                                    opacity: isExpanded ? 0.42 : (isDimmed ? 0.1 : 0.24)
                                })
                            );
                            graphGroup.add(tetherLine);

                            store.orbitMolecules.push({
                                kwId: kw.id,
                                mesh: kMesh,
                                halo,
                                center: secCenter.clone(),
                                radius: orbitRadius,
                                baseAngle,
                                speed: orbitSpeed,
                                tiltX: localTiltX,
                                tiltZ: localTiltZ,
                                tetherLine
                            });

                            // Persistent 3D Floating Label with distance-aware opacity
                            if (isExpanded || isKwSelected || isBursted) {
                                addLabel(kMesh, `
                                    <div class="px-2 py-0.5 rounded-md bg-slate-950/95 border ${isBursted ? 'border-amber-400' : isKwSelected ? 'border-cyan-300' : 'border-emerald-400/65'} text-[9.5px] font-mono text-white whitespace-nowrap shadow-lg">
                                        <span class="text-cyan-300 font-bold">#${kw.narrativeStep || kIdx + 1}</span> ${kw.name}
                                        <span class="${isPos ? 'text-emerald-400' : 'text-rose-400'} font-bold ml-1">${kw.deltaPct}</span>
                                    </div>
                                `, volScale + 0.54, true, {
                                    onSingle: () => latestProps.current.onSelectAndBurstKeyword(kw.id, false),
                                    onDouble: () => latestProps.current.onSelectAndBurstKeyword(kw.id, true)
                                });
                            } else {
                                addLabel(kMesh, `
                                    <div class="px-1.5 py-0.5 rounded bg-slate-950/82 border border-slate-700/80 text-[8.5px] font-mono text-slate-100 whitespace-nowrap shadow">
                                        ${kw.name} <span class="${isPos ? 'text-emerald-400' : 'text-rose-400'} font-semibold">${kw.deltaPct}</span>
                                    </div>
                                `, volScale + 0.36, false, {
                                    onSingle: () => latestProps.current.onSelectAndBurstKeyword(kw.id, false),
                                    onDouble: () => latestProps.current.onSelectAndBurstKeyword(kw.id, true)
                                });
                            }

                            // DOUBLE-CLICK MOLECULE: REVOLVING GOLDEN-AMBER DUPLICATE ALIAS SUB-ATOMS!
                            if (isBursted) {
                                const aliasItems = (kw.surfaceForms || []).map(text => ({ label: text, kind: 'ALIAS' }));
                                const shellGroup = new THREE.Group();
                                shellGroup.position.copy(kMesh.position);
                                const shell1 = new THREE.Mesh(
                                    new THREE.TorusGeometry(2.2, 0.03, 8, 44),
                                    new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.78 })
                                );
                                shell1.rotation.x = Math.PI / 2 + 0.42;
                                const shell2 = new THREE.Mesh(
                                    new THREE.TorusGeometry(2.65, 0.024, 8, 44),
                                    new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.55 })
                                );
                                shell2.rotation.set(Math.PI / 2 - 0.5, 0.32, 0.44);
                                shellGroup.add(shell1, shell2);
                                graphGroup.add(shellGroup);
                                store.burstShellGroups.push({ group: shellGroup, parentMesh: kMesh });

                                aliasItems.forEach((subItem, fIdx) => {
                                    const subRadius = fIdx % 2 === 0 ? 2.2 : 2.65;
                                    const subBaseAngle = (fIdx / Math.max(1, aliasItems.length)) * Math.PI * 2;
                                    const subSpeed = (fIdx % 2 === 0 ? 1.38 : -1.12) + (fIdx % 3) * 0.14;
                                    const subTiltX = fIdx % 2 === 0 ? 0.42 : -0.5;
                                    const subTiltZ = fIdx % 2 === 0 ? -0.22 : 0.44;

                                    const subPos = new THREE.Vector3();
                                    computeTiltedOrbitPoint(kMesh.position, subRadius, subBaseAngle + store.orbitTime * subSpeed, subTiltX, subTiltZ, subPos);

                                    const subMesh = new THREE.Mesh(
                                        new THREE.OctahedronGeometry(0.26, 0),
                                        new THREE.MeshStandardMaterial({
                                            color: fIdx % 2 === 0 ? 0xf59e0b : 0xfde047,
                                            emissive: 0xd97706,
                                            emissiveIntensity: 0.88,
                                            roughness: 0.2,
                                            metalness: 0.42
                                        })
                                    );
                                    subMesh.position.copy(subPos);
                                    graphGroup.add(subMesh);

                                    const bondGeo = new THREE.BufferGeometry();
                                    bondGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                                        kMesh.position.x, kMesh.position.y, kMesh.position.z,
                                        subPos.x, subPos.y, subPos.z
                                    ]), 3));
                                    const bondLine = new THREE.Line(
                                        bondGeo,
                                        new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.92 })
                                    );
                                    graphGroup.add(bondLine);

                                    store.burstSubAtoms.push({
                                        parentMesh: kMesh,
                                        mesh: subMesh,
                                        bondLine,
                                        radius: subRadius,
                                        baseAngle: subBaseAngle,
                                        speed: subSpeed,
                                        tiltX: subTiltX,
                                        tiltZ: subTiltZ
                                    });

                                    addLabel(subMesh, `
                                        <div class="px-1.5 py-0.5 rounded bg-amber-950/95 border border-amber-400/80 text-[8.5px] font-mono text-amber-100 whitespace-nowrap shadow">
                                            <span class="text-amber-400 font-bold">⚛</span> ${subItem.label}
                                        </div>
                                    `, 0.45, true);
                                });
                            }
                        });

                        // Narrative Chain Emerald Bonds (#1 -> #2 -> #3 -> #4 -> #5) + Synaptic Pulses
                        secKws.forEach((kw, kIdx) => {
                            if (kw.narrativeChainNext && store.keywordMeshes[kw.id] && store.keywordMeshes[kw.narrativeChainNext]) {
                                const fromMesh = store.keywordMeshes[kw.id];
                                const toMesh = store.keywordMeshes[kw.narrativeChainNext];
                                const chainGeo = new THREE.BufferGeometry();
                                chainGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                                    fromMesh.position.x, fromMesh.position.y, fromMesh.position.z,
                                    toMesh.position.x, toMesh.position.y, toMesh.position.z
                                ]), 3));
                                const chainLine = new THREE.Line(
                                    chainGeo,
                                    new THREE.LineBasicMaterial({
                                        color: 0x34d399,
                                        transparent: true,
                                        opacity: isExpanded ? 0.95 : (isDimmed ? 0.1 : 0.36)
                                    })
                                );
                                graphGroup.add(chainLine);

                                let pulseMesh = null;
                                if (isExpanded) {
                                    pulseMesh = new THREE.Mesh(
                                        new THREE.SphereGeometry(0.16, 10, 10),
                                        new THREE.MeshBasicMaterial({ color: 0x34d399 })
                                    );
                                    graphGroup.add(pulseMesh);
                                }
                                store.dynamicLinks.push({
                                    fromMesh,
                                    toMesh,
                                    line: chainLine,
                                    pulseMesh,
                                    pulseElapsed: kIdx * 0.35,
                                    pulseDuration: 1.3
                                });
                            }
                        });
                    }
                });

                // Cross-Sector & Cross-Keyword Jaggard Bridge Beams with Magenta Pulses
                jaggardPairs.forEach((pair, pIdx) => {
                    const objA = pair.type === 'sector' ? store.sectorMeshes[pair.aId] : store.keywordMeshes[pair.aId];
                    const objB = pair.type === 'sector' ? store.sectorMeshes[pair.bId] : store.keywordMeshes[pair.bId];
                    if (objA && objB) {
                        const isHighlighted = activeSectorIds.has(pair.aId) || activeSectorIds.has(pair.bId)
                            || selectedKeywordId === pair.aId || selectedKeywordId === pair.bId;

                        const bridgeGeo = new THREE.BufferGeometry();
                        bridgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                            objA.position.x, objA.position.y, objA.position.z,
                            objB.position.x, objB.position.y, objB.position.z
                        ]), 3));
                        const bLine = new THREE.Line(
                            bridgeGeo,
                            new THREE.LineBasicMaterial({
                                color: 0xe879f9,
                                transparent: true,
                                opacity: isHighlighted ? 0.96 : (hasSelectionContext ? 0.14 : 0.35)
                            })
                        );
                        graphGroup.add(bLine);

                        let pulseMesh = null;
                        if (isHighlighted || pair.type === 'keyword') {
                            pulseMesh = new THREE.Mesh(
                                new THREE.SphereGeometry(0.17, 10, 10),
                                new THREE.MeshBasicMaterial({ color: 0xf0abfc })
                            );
                            graphGroup.add(pulseMesh);
                        }

                        if (pair.type === 'keyword') {
                            store.dynamicLinks.push({
                                fromMesh: objA,
                                toMesh: objB,
                                line: bLine,
                                pulseMesh,
                                pulseElapsed: pIdx * 0.4,
                                pulseDuration: 1.55
                            });
                        } else if (pulseMesh) {
                            store.staticPulses.push({
                                mesh: pulseMesh,
                                from: objA.position.clone(),
                                to: objB.position.clone(),
                                elapsed: pIdx * 0.4,
                                duration: 1.55
                            });
                        }
                    }
                });
            }, [sectors, keywords, jaggardPairs, viewMode, selectedSectorId, selectedKeywordId, expandedSectors, burstKeywords]);

            // Handle RiftBot Commands (Wave Hi / Construct Node / Bridge Weld / Patrol / Dock)
            useEffect(() => {
                if (!botCommandReq || !sceneRefs.current.botState) return;
                const store = sceneRefs.current;
                const bs = store.botState;
                const { mode, keywordId, sectorId, pairA, pairB } = botCommandReq;

                if (mode === 'greeting') {
                    bs.mode = 'greeting';
                    bs.timer = 0;
                    bs.duration = 4.5;
                } else if (mode === 'docked') {
                    bs.mode = 'docked';
                    bs.timer = 0;
                } else if (mode === 'patrolling') {
                    bs.mode = 'patrolling';
                    bs.timer = 0;
                    bs.targetMesh = null;
                    bs.secondaryMesh = null;
                    bs.patrolCooldown = 0.2;
                } else if (mode === 'constructing') {
                    let target = null;
                    let secondary = null;
                    if (pairA && pairB) {
                        target = store.sectorMeshes[pairA] || store.keywordMeshes[pairA];
                        secondary = store.sectorMeshes[pairB] || store.keywordMeshes[pairB];
                    } else if (keywordId && store.keywordMeshes[keywordId]) {
                        target = store.keywordMeshes[keywordId];
                    } else if (sectorId && store.sectorMeshes[sectorId]) {
                        target = store.sectorMeshes[sectorId];
                    }
                    if (target) {
                        bs.mode = 'constructing';
                        bs.timer = 0;
                        bs.duration = 9.0;
                        bs.targetMesh = target;
                        bs.secondaryMesh = secondary;
                        bs.ringSpawnTimer = 0.5;
                    }
                }
            }, [botCommandReq]);

            // Handle Smooth Camera Fly-To Focus Interpolation
            useEffect(() => {
                if (!cameraFocusReq || !sceneRefs.current.camera) return;
                const store = sceneRefs.current;
                const { sectorId, keywordId, pairIds } = cameraFocusReq;
                let lookVec = null;
                let dist = 16;

                if (pairIds && pairIds.length === 2) {
                    const objA = store.sectorMeshes[pairIds[0]] || store.keywordMeshes[pairIds[0]];
                    const objB = store.sectorMeshes[pairIds[1]] || store.keywordMeshes[pairIds[1]];
                    if (objA && objB) {
                        lookVec = new THREE.Vector3().addVectors(objA.position, objB.position).multiplyScalar(0.5);
                        dist = Math.max(22, objA.position.distanceTo(objB.position) * 1.15);
                    }
                } else if (keywordId && store.keywordMeshes[keywordId]) {
                    lookVec = store.keywordMeshes[keywordId].position.clone();
                    dist = 13.5;
                } else if (sectorId && store.sectorMeshes[sectorId]) {
                    lookVec = store.sectorMeshes[sectorId].position.clone();
                    dist = 19.5;
                }

                if (lookVec) {
                    const dirOut = lookVec.lengthSq() > 0.1
                        ? lookVec.clone().normalize()
                        : new THREE.Vector3(0, 0.3, 1).normalize();
                    const camDest = lookVec.clone().add(dirOut.multiplyScalar(dist));
                    camDest.y += 3.5;
                    store.camFly = { active: true, targetPos: camDest, targetLook: lookVec };
                }
            }, [cameraFocusReq]);

            // Expanding Energy Ripple Waves
            useEffect(() => {
                if (!rippleRequest || !sceneRefs.current.scene) return;
                const store = sceneRefs.current;
                const target = rippleRequest.keywordId
                    ? store.keywordMeshes[rippleRequest.keywordId]
                    : store.sectorMeshes[rippleRequest.sectorId];
                if (target) {
                    const ring = new THREE.Mesh(
                        new THREE.RingGeometry(0.32, 0.54, 32),
                        new THREE.MeshBasicMaterial({ color: rippleRequest.color || 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.92 })
                    );
                    ring.position.copy(target.position);
                    store.scene.add(ring);
                    store.rippleWaves.push({ mesh: ring, targetMesh: target, elapsed: 0, duration: 1.4 });
                }
            }, [rippleRequest]);

            // Smooth Camera Reset
            useEffect(() => {
                if (!cameraResetTick || !sceneRefs.current.camera) return;
                sceneRefs.current.camFly = {
                    active: true,
                    targetPos: new THREE.Vector3(0, 10, 44),
                    targetLook: new THREE.Vector3(0, 0, 0)
                };
            }, [cameraResetTick]);

            return html`
                <${Fragment}>
                    <div id="canvas-container" ref=${canvasRef}></div>
                    <div id="label-container" ref=${labelRef}></div>
                <//>
            `;
        }

                                    ${activeSecBridges.length === 0 ? html`

        function JaggardMainViewScreen({

        }) {

            const list = bridgeType === 'sector' ? sectors : keywords.slice(0, 50);
            const itemA = list.find(x => x.id === nodeA) || list[0];
            const itemB = list.find(x => x.id === nodeB) || list[1] || list[0];
            const previewScore = Number((0.54 + ((itemA.name.length * 3 + itemB.name.length * 5) % 42) / 100).toFixed(2));
            const previewPct = Math.round(previewScore * 100);

            const filteredCards = jaggardPairs.filter(j => {
                const q = filterText.trim().toLowerCase();
                if (!q) return true;
                return j.title.toLowerCase().includes(q)
                    || (j.shared || []).some(s => s.toLowerCase().includes(q));
            });

            // SVG Radial Jaccard Overlap Gauge helper
            const renderRadialGauge = (score) => {
                const pct = Math.round(score * 100);
                const radius = 30;
                const circumference = 2 * Math.PI * radius; // ~188.5
                const dashOffset = circumference * (1 - Math.min(1, Math.max(0, score)));
                const strokeColor = pct >= 90 ? '#22d3ee' : pct >= 85 ? '#e879f9' : '#34d399';
                return html`
                    <div className="relative w-[76px] h-[76px] flex items-center justify-center shrink-0">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 76 76">
                            <circle cx="38" cy="38" r=${radius} stroke="rgba(148,163,184,0.18)" strokeWidth="6" fill="none" />
                            <circle cx="38" cy="38" r=${radius} stroke=${strokeColor} strokeWidth="6" fill="none"
                                strokeLinecap="round"
                                strokeDasharray=${circumference}
                                strokeDashoffset=${dashOffset}
                                className="gauge-arc" />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="font-mono text-xs font-extrabold text-white">${pct}%</span>
                            <span className="font-mono text-[8.5px] text-fuchsia-300">J=${score}</span>
                        </div>
                    </div>

            };

            return html`

                                <span className="text-xs font-bold text-cyan-300 mr-1">Build Bridge:</span>
                                <select value=${bridgeType} onChange=${(e) => {

                                                        ${card.type === 'sector' ? 'Sector Bridge' : 'Molecule Bridge'}
                                                    </span>
                                                    <span className="text-[10px] font-mono text-cyan-300">${card.sharedArticles || 22} Shared Articles</span>
                                                </div>
                                                <h3 className="text-sm font-extrabold text-white leading-snug">${card.title}</h3>
                                            </div>
                                            ${renderRadialGauge(card.score)}

                                        <!-- Connected Keyword Bridge Chain Pills -->
                                        <div className="space-y-1.5 pt-2 border-t border-slate-800/80">

                                            <div className="flex flex-wrap gap-1.5">
                                                ${(card.shared || []).map((kwLabel, idx) => {
                                                    const matchedKw = keywords.find(k => k.name.toLowerCase() === kwLabel.toLowerCase() || (card.keywordIds || [])[idx] === k.id);
