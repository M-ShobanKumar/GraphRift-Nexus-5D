        function RiftBotCompanionCard({
            botMode, botVisible, botTelemetry, speechText, keywords, sectors, jaggardPairs,
            onWaveHi, onConstructActive, onPatrol, onDock, onToggleVisible
        }) {
            const [collapsed, setCollapsed] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [chatLog, setChatLog] = useState([]);

            const statusMeta = {
                greeting: { label: 'GREETING', color: 'bg-emerald-500/25 text-emerald-200 border-emerald-400/50' },
                constructing: { label: 'CONSTRUCTING', color: 'bg-amber-500/25 text-amber-200 border-amber-400/50' },
                patrolling: { label: 'PATROLLING', color: 'bg-cyan-500/25 text-cyan-200 border-cyan-400/50' },
                docked: { label: 'DOCKED', color: 'bg-purple-500/25 text-purple-200 border-purple-400/50' }
            }[botMode] || { label: 'ONLINE', color: 'bg-cyan-500/25 text-cyan-200 border-cyan-400/50' };

            const handleChatSubmit = () => {
                const q = chatInput.trim();
                if (!q) return;
                setChatInput('');
                const low = q.toLowerCase();
                const hit = keywords.find(k =>
                    k.name.toLowerCase().includes(low) ||
                    (k.surfaceForms || []).some(sf => sf.toLowerCase().includes(low)) ||
                    (k.entities || []).some(ent => ent.toLowerCase().includes(low))
                );
                let reply;
                if (hit) {
                    const sec = sectors.find(s => s.id === hit.sectorId);
                    reply = `Found canonical cluster "${hit.name}" (${hit.deltaPct}) in ${sec?.shortName}! It unifies ${(hit.surfaceForms || []).length} duplicate variants (${(hit.surfaceForms || []).slice(0, 4).join(', ')}) with Bridge Resonance J=${hit.bridgeStrength}.`;
                } else if (low.includes('bridge') || low.includes('jaggard')) {
                    const topBr = jaggardPairs[0];
                    reply = `Tracking ${jaggardPairs.length} Jaggard sector bridges! Strongest link: ${topBr?.title} (J=${topBr?.score}, ${topBr?.sharedArticles} shared articles).`;
                } else {
                    const top = [...keywords].sort((a, b) => b.deltaNum - a.deltaNum)[0];
                    reply = `All 100 molecules across 20 sectors are online! Top velocity surge is "${top.name}" (${top.deltaPct}) unifying ${(top.surfaceForms || []).length} duplicate variants.`;
                }
                setChatLog(prev => [...prev.slice(-4), { q, reply }]);
            };

            return html`
                <div className="fixed bottom-2.5 right-2.5 w-[min(370px,calc(100vw-1.25rem))] glass-hud rounded-2xl shadow-2xl z-30 border border-cyan-400/45 riftbot-glow overflow-hidden">

                            <div className="min-w-0">
                                <div className="flex items-center gap-1.5">
                                    <span className="text-xs font-extrabold text-cyan-300 tracking-wide">RIFTBOT</span>
                                    <span className=${`text-[8.5px] font-mono px-1.5 py-0.2 rounded border font-bold ${statusMeta.color}`}>${statusMeta.label}</span>
                                </div>
                                <div className="text-[9.5px] font-mono text-slate-400 truncate">
                                    X:${botTelemetry.x} Y:${botTelemetry.y} Z:${botTelemetry.z} ${botTelemetry.laserOn ? '• ⚡ LASER ON' : ''}
                                </div>
                            </div>
                        </div>
                        <button onClick=${() => setCollapsed(!collapsed)} className="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 text-cyan-300 font-mono text-[10px] flex items-center justify-center shrink-0">
                            ${collapsed ? '▲' : '▼'}
                        </button>
                    </div>

                    ${!collapsed && html`
                        <div className="p-2.5 space-y-2">
                            <!-- Animated Speech Bubble -->
                            <div className="px-2.5 py-1.5 rounded-xl bg-slate-950/90 border border-cyan-500/30 text-[11px] text-cyan-100 leading-snug">
                                ${speechText}
                            </div>

                            <!-- 5 Quick Command Buttons -->
                            <div className="flex flex-wrap gap-1">
                                <button onClick=${onWaveHi} className="px-2 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-400/40 text-emerald-200 text-[10px] font-bold transition">👋 Wave Hi</button>
                                <button onClick=${onConstructActive} className="px-2 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/35 border border-amber-400/40 text-amber-200 text-[10px] font-bold transition">⚡ Construct Node</button>
                                <button onClick=${onPatrol} className="px-2 py-1 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/40 text-cyan-200 text-[10px] font-bold transition">🛸 Patrol</button>
                                <button onClick=${onDock} className="px-2 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500/35 border border-purple-400/40 text-purple-200 text-[10px] font-bold transition">⏸ Dock</button>
                                <button onClick=${onToggleVisible} className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-[10px] font-bold transition">
                                    ${botVisible ? '👁 Hide Bot' : '👁 Show Bot'}
                                </button>
                            </div>

                            <!-- Mini Interactive Chat -->
                            ${chatLog.length > 0 && html`
                                <div className="max-h-20 overflow-y-auto custom-scroll space-y-1 text-[10.5px] pt-1 border-t border-slate-800 pr-1">
                                    ${chatLog.map((m, i) => html`
                                        <div key=${i}>
                                            <div className="text-slate-400"><b>You:</b> ${m.q}</div>
                                            <div className="text-cyan-200"><b>RiftBot:</b> ${m.reply}</div>
                                        </div>
                                    `)}
                                </div>
                            `}
                            <div className="flex gap-1">
                                <input type="text" value=${chatInput} onChange=${(e) => setChatInput(e.target.value)}
                                    onKeyDown=${(e) => e.key === 'Enter' && handleChatSubmit()}
                                    placeholder="Ask RiftBot: gta5, nfc, socceroos, bridges..."
                                    className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-[11px] text-white focus:outline-none focus:border-cyan-400" />
                                <button onClick=${handleChatSubmit} className="px-2.5 py-1 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-[11px]">Ask</button>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        // =========================================================================

        function App() {
            const [sectors, setSectors] = useState(INITIAL_SECTORS);
            const [keywords, setKeywords] = useState(generate100RichKeywords);
            const [jaggardPairs, setJaggardPairs] = useState(INITIAL_JAGGARD);

            const [mainScreen, setMainScreen] = useState('graph3d'); // 'graph3d' | 'jaggard'
            const [focusedBridgeId, setFocusedBridgeId] = useState(null);
            const [viewMode, setViewMode] = useState('orbiting100'); // 'orbiting100' | 'sectorOnly'
            const [orbitsEnabled, setOrbitsEnabled] = useState(true);
            const [hudHidden, setHudHidden] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);

            const [leftPanelOpen, setLeftPanelOpen] = useState(() => window.innerWidth >= 1024);
            const [activeLeftTab, setActiveLeftTab] = useState('sectors');
            const [rightDrawerOpen, setRightDrawerOpen] = useState(() => window.innerWidth >= 1280);
            const [selectedSectorId, setSelectedSectorId] = useState('sec_0');
            const [selectedKeywordId, setSelectedKeywordId] = useState('kw_5'); // GTA 6 canonical cluster featured

            const [expandedSectors, setExpandedSectors] = useState(() => new Set(['sec_0', 'sec_1']));
            const [burstKeywords, setBurstKeywords] = useState(() => new Set());

            // RiftBot State (Greets on entry!)
            const [riftBotMode, setRiftBotMode] = useState('greeting');
            const [riftBotVisible, setRiftBotVisible] = useState(true);
            const [botTelemetry, setBotTelemetry] = useState({ x: '0.0', y: '0.0', z: '0.0', laserOn: false });
            const [botSpeech, setBotSpeech] = useState('Hi! Ready to construct 5D neural vertices!');
            const [botCommandReq, setBotCommandReq] = useState(null);

            const [cameraFocusReq, setCameraFocusReq] = useState(null);
            const [rippleRequest, setRippleRequest] = useState(null);
            const [cameraResetTick, setCameraResetTick] = useState(0);
            const [stageSubtitle, setStageSubtitle] = useState(
                '100 Revolving 5D Molecules • Click Sector: Linked Bridges • Dbl-Click Keyword: Alias Sub-Atoms'
            );
            const [toastMsg, setToastMsg] = useState('');

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3200);
            }, []);

            const toggleFullscreen = useCallback(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(() => showToast('Fullscreen blocked by sandbox.'));
                } else {
                    document.exitFullscreen?.().catch(() => {});
                }
            }, [showToast]);

            // Keyboard Shortcuts: F (Fullscreen), H (Hide/Show HUD), Esc (Return to 3D Graph)
            useEffect(() => {
                const onFsChange = () => setIsFullscreen(Boolean(document.fullscreenElement));
                const onKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                    if (e.key === 'h' || e.key === 'H') setHudHidden(p => !p);
                    if (e.key === 'Escape') setMainScreen('graph3d');
                };
                document.addEventListener('fullscreenchange', onFsChange);
                window.addEventListener('keydown', onKeyDown);
                return () => {
                    document.removeEventListener('fullscreenchange', onFsChange);
                    window.removeEventListener('keydown', onKeyDown);
                };
            }, [toggleFullscreen]);

            // Single-Click Sector: highlight + magenta LINKED neighbors + camera focus
            const handleSelectSector = useCallback((sectorId, flyCamera = false) => {
                setMainScreen('graph3d');
                setSelectedSectorId(sectorId);
                setRippleRequest({ sectorId, color: 0xe879f9, ts: Date.now() });
                if (flyCamera) setCameraFocusReq({ sectorId, ts: Date.now() });
                const sec = sectors.find(s => s.id === sectorId);
                setStageSubtitle(`Selected Sector: "${sec?.name || ''}" (Magenta = LINKED Sectors • Dbl-Click to Burst Chain)`);
            }, [sectors]);

            // Double-Click Sector: expand/burst its 5D revolving molecules & narrative chain + RiftBot weld
            const handleToggleSectorBurst = useCallback((sectorId, forceExpand = null) => {
                setMainScreen('graph3d');
                setSelectedSectorId(sectorId);
                setExpandedSectors(prev => {
                    const next = new Set(prev);
                    const shouldExpand = forceExpand !== null ? forceExpand : !next.has(sectorId);
                    if (shouldExpand) {
                        next.add(sectorId);
                        setRippleRequest({ sectorId, color: 0x22d3ee, ts: Date.now() });
                        setCameraFocusReq({ sectorId, ts: Date.now() });
                        setRiftBotMode('constructing');
                        setBotCommandReq({ mode: 'constructing', sectorId, ts: Date.now() });
                        const sec = sectors.find(s => s.id === sectorId);
                        setBotSpeech(`Flying to ${sec?.shortName}! Welding 5-step narrative vertices with plasma laser...`);
                        setStageSubtitle(`Bursting Sector: "${sec?.name || ''}" • Dbl-Click Molecule to Explode Duplicate Aliases`);
                    } else {
                        next.delete(sectorId);
                    }
                    return next;
                });
            }, [sectors]);

            // Click / Double-Click Molecule: inspect, fly camera, burst duplicate aliases, dispatch RiftBot!
            const handleSelectAndBurstKeyword = useCallback((kwId, toggleBurst = false, flyCamera = false) => {
                const kw = keywords.find(k => k.id === kwId);
                if (!kw) return;
                setMainScreen('graph3d');
                setSelectedKeywordId(kw.id);
                setSelectedSectorId(kw.sectorId);
                setRightDrawerOpen(true);
                setExpandedSectors(prev => new Set(prev).add(kw.sectorId));

                if (toggleBurst) {
                    setBurstKeywords(prev => {
                        const next = new Set(prev);
                        const willBurst = !next.has(kw.id);
                        willBurst ? next.add(kw.id) : next.delete(kw.id);
                        setRippleRequest({ keywordId: kw.id, color: 0xf59e0b, ts: Date.now() });
                        setBotSpeech(willBurst
                            ? `Atomic alias burst on "${kw.name}"! ${(kw.surfaceForms || []).length} duplicate variants are now orbiting in amber!`
                            : `Collapsed duplicate sub-atoms back into "${kw.name}".`
                        );
                        return next;
                    });
                } else {
                    setBotSpeech(`Constructing & inspecting "${kw.name}" (${kw.deltaPct}) — Bridge Resonance J=${kw.bridgeStrength}!`);
                }

                if (flyCamera) setCameraFocusReq({ keywordId: kw.id, ts: Date.now() });
                setRiftBotMode('constructing');
                setBotCommandReq({ mode: 'constructing', keywordId: kw.id, ts: Date.now() });
                setStageSubtitle(`Molecule: "${kw.name}" (${kw.deltaPct} • ${(kw.surfaceForms || []).length} Aliases • J=${kw.bridgeStrength})`);
            }, [keywords]);

            // Inspect a Jaggard Bridge Card directly in 3D space!
            const handleInspectBridgeIn3D = useCallback((card) => {
                setMainScreen('graph3d');
                setFocusedBridgeId(card.id);
                if (card.type === 'sector') {
                    setSelectedSectorId(card.aId);
                    setExpandedSectors(prev => {
                        const next = new Set(prev);
                        next.add(card.aId);
                        next.add(card.bId);
                        return next;
                    });
                } else {
                    const kwA = keywords.find(k => k.id === card.aId);
                    const kwB = keywords.find(k => k.id === card.bId);
                    setExpandedSectors(prev => {
                        const next = new Set(prev);
                        if (kwA) next.add(kwA.sectorId);
                        if (kwB) next.add(kwB.sectorId);
                        return next;
                    });
                    if (kwA) setSelectedKeywordId(kwA.id);
                }
                setTimeout(() => {
                    setCameraFocusReq({ pairIds: [card.aId, card.bId], ts: Date.now() });
                    setRiftBotMode('constructing');
                    setBotCommandReq({ mode: 'constructing', pairA: card.aId, pairB: card.bId, ts: Date.now() });
                }, 120);
                setBotSpeech(`Welding cross-sector bridge "${card.title}" (J=${card.score}) in 3D space!`);
                setStageSubtitle(`Inspecting Bridge: ${card.title} (Overlap ${card.overlapPct || Math.round(card.score * 100)}%)`);
                showToast(`Focused 3D camera on bridge: ${card.title}`);
            }, [keywords, showToast]);

            // Delete an inline article from a keyword
            const handleDeleteArticle = useCallback((kwId, artId) => {
                setKeywords(prev => prev.map(k => k.id === kwId ? { ...k, articles: (k.articles || []).filter(a => a.id !== artId) } : k));
                showToast('Removed linked article.');
            }, [showToast]);

            // Pin a new Jaggard Bridge Card
            const handlePinBridge = useCallback((type, itemA, itemB, customScore) => {
                if (!itemA || !itemB || itemA.id === itemB.id) return showToast('Select two distinct nodes to bridge.');
                const score = customScore || Number((0.68 + ((itemA.name.length + itemB.name.length) % 28) / 100).toFixed(2));
                const sharedKws = type === 'sector'
                    ? [...keywords.filter(k => k.sectorId === itemA.id).slice(0, 2), ...keywords.filter(k => k.sectorId === itemB.id).slice(0, 2)]
                    : [itemA, itemB];
                const newCard = {
                    id: `jag_${Date.now()}`,
                    type,
                    aId: itemA.id,
                    bId: itemB.id,
                    title: `${itemA.name} ↔ ${itemB.name}`,
                    score,
                    overlapPct: Math.round(score * 100),
                    sharedArticles: 14 + Math.floor(score * 30),
                    shared: sharedKws.map(k => k.name),
                    keywordIds: sharedKws.map(k => k.id)
                };
                setJaggardPairs(prev => [newCard, ...prev]);
                showToast(`Pinned new Jaggard Bridge (J=${score})!`);
            }, [keywords, showToast]);

            // Add New Canonical Cluster (Dispatches RiftBot to fly over & construct!)
            const handleAddKeyword = useCallback((name, aliasesRaw, sectorId) => {
                if (!name.trim()) return showToast('Enter a canonical cluster name.');
                const forms = aliasesRaw.split(',').map(s => s.trim()).filter(Boolean);
                const newId = `kw_${Date.now()}`;
                const newKw = {
                    id: newId,
                    sectorId,
                    name: name.trim(),
                    entityType: 'Trend',
                    surfaceForms: forms.length ? forms : [name.trim().toLowerCase()],
                    entities: [name.trim()],
                    deltaPct: '+245.0%',
                    deltaNum: 245.0,
                    baseline30d: 1400,
                    currentVol: 32800,
                    mentions24h: 6200,
                    narrativeStep: 6,
                    bridgeCount: 3,
                    bridgeStrength: 0.88,
                    sparkline: [18, 28, 42, 59, 75, 88, 97],
                    fromSheet: false,
                    articles: [{
                        id: `art_${newId}`,
                        title: `Live Canonical Cluster Wired: ${name.trim()}`,
                        source: 'Nexus5D Workstation',
                        url: `https://news.google.com/search?q=${encodeURIComponent(name.trim())}`,
                        time: 'Just now',
                        bridgeRelevance: 94
                    }]
                };
                setKeywords(prev => [newKw, ...prev]);
                setMainScreen('graph3d');
                setExpandedSectors(prev => new Set(prev).add(sectorId));
                setSelectedKeywordId(newId);
                setRightDrawerOpen(true);
                setTimeout(() => {
                    setRippleRequest({ keywordId: newId, color: 0x10b981, ts: Date.now() });
                    setCameraFocusReq({ keywordId: newId, ts: Date.now() });
                    setRiftBotMode('constructing');
                    setBotCommandReq({ mode: 'constructing', keywordId: newId, ts: Date.now() });
                }, 120);
                setBotSpeech(`Constructing brand-new molecule "${newKw.name}" with ${newKw.surfaceForms.length} aliases!`);
                showToast(`RiftBot constructing "${newKw.name}" in 5D space!`);
            }, [showToast]);

            // Google Trends Live RSS Preset Fetcher (with graceful simulated live fallback if CORS blocks)
            const handleFetchRssPreset = useCallback(async (preset) => {
                showToast(`Fetching ${preset.label} (${preset.geo})...`);
                let ingested = [];
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(preset.url)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const xml = data.contents || '';
                        const items = [...xml.matchAll(/<item>[\s\S]*?<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>[\s\S]*?<\/item>/g)].slice(0, 4);
                        ingested = items.map((m, idx) => {
                            const title = (m[1] || '').trim();
                            if (!title) return null;
                            return {
                                id: `rss_${preset.geo}_${Date.now()}_${idx}`,
                                sectorId: preset.defaultSector,
                                name: title,
                                entityType: 'Trend',
                                surfaceForms: [title.toLowerCase(), `${title.toLowerCase()} ${preset.geo.toLowerCase()}`],
                                entities: [`Google Trends ${preset.geo}`],
                                deltaPct: `+${(180 + idx * 45).toFixed(1)}%`,
                                deltaNum: 180 + idx * 45,
                                baseline30d: 1200,
                                currentVol: 28000 + idx * 4500,
                                mentions24h: 5200,
                                narrativeStep: 6 + idx,
                                bridgeCount: 3,
                                bridgeStrength: 0.84,
                                sparkline: [20, 32, 46, 62, 76, 88, 96],
                                fromSheet: true,
                                articles: [{
                                    id: `art_rss_${Date.now()}_${idx}`,
                                    title: `Trending Now (${preset.geo}): ${title}`,
                                    source: `Google Trends ${preset.geo}`,
                                    url: preset.url,
                                    time: 'Live RSS',
                                    bridgeRelevance: 91
                                }]
                            };
                        }).filter(Boolean);
                    }
                } catch (err) {
                    // Graceful CORS fallback handled immediately below
                }

                if (ingested.length === 0) {
                    ingested = preset.fallbackItems.map((fi, idx) => ({
                        id: `rss_fb_${preset.geo}_${Date.now()}_${idx}`,
                        sectorId: preset.defaultSector,
                        name: fi.name,
                        entityType: 'Trend',
                        surfaceForms: fi.aliases,
                        entities: [fi.source],
                        deltaPct: fi.delta,
                        deltaNum: parseFloat(fi.delta) || 260,
                        baseline30d: 1350,
                        currentVol: 34500 + idx * 3800,
                        mentions24h: 6400,
                        narrativeStep: 6 + idx,
                        bridgeCount: 3,
                        bridgeStrength: 0.86,
                        sparkline: [22, 34, 50, 66, 80, 91, 98],
                        fromSheet: true,
                        articles: [{
                            id: `art_fb_${Date.now()}_${idx}`,
                            title: `${fi.name} Surges on ${fi.source} Daily Feed`,
                            source: fi.source,
                            url: preset.url,
                            time: 'Just now',
                            bridgeRelevance: 92
                        }]
                    }));
                }

                setKeywords(prev => [...ingested, ...prev]);
                setExpandedSectors(prev => new Set(prev).add(preset.defaultSector));
                setMainScreen('graph3d');
                setTimeout(() => {
                    setCameraFocusReq({ sectorId: preset.defaultSector, ts: Date.now() });
                    setRiftBotMode('constructing');
                    setBotCommandReq({ mode: 'constructing', sectorId: preset.defaultSector, ts: Date.now() });
                }, 140);
                setBotSpeech(`Wired ${ingested.length} live trends from ${preset.label} into 5D orbit!`);
                showToast(`Loaded ${ingested.length} trends from ${preset.label}!`);
            }, [showToast]);

            const handleIngestCustomRss = useCallback(async (url, sectorId) => {
                if (!url.trim()) return showToast('Enter an RSS XML URL first.');
                await handleFetchRssPreset({
                    geo: 'CUSTOM',
                    label: 'Custom RSS Feed',
                    url: url.trim(),
                    defaultSector: sectorId,
                    fallbackItems: [{ name: 'Live Custom RSS Signal', aliases: ['rss trend', 'custom xml feed'], delta: '+195.0%', source: 'Custom RSS' }]
                });
            }, [handleFetchRssPreset, showToast]);

            const handleAddManualArticle = useCallback((title, url, source, kwId) => {
                if (!title.trim()) return showToast('Enter an article headline.');
                setKeywords(prev => prev.map(k => k.id === kwId ? {
                    ...k,
                    articles: [{
                        id: `art_man_${Date.now()}`,
                        title: title.trim(),
                        source: source.trim() || 'Direct Feed',
                        url: url.trim() || '#',
                        time: 'Just now',
                        bridgeRelevance: 95
                    }, ...(k.articles || [])]
                } : k));
                showToast('Published & linked article to molecule!');
            }, [showToast]);

            const handleExportExcel = useCallback(() => {
                const rows = keywords.map(k => {
                    const sec = sectors.find(s => s.id === k.sectorId) || sectors[0];
                    return `<tr><td>${sec.name}</td><td>${k.name}</td><td>${(k.surfaceForms || []).join(', ')}</td><td>${k.deltaPct}</td><td>${k.bridgeStrength}</td></tr>`;
                }).join('');
                const htmlStr = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>Macro_Sector</th><th>Canonical_Molecule</th><th>Duplicate_Aliases</th><th>Velocity</th><th>Bridge_Score</th></tr>${rows}</table></body></html>`;
                const blob = new Blob([htmlStr], { type: 'application/vnd.ms-excel' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'Nexus5D_GraphRift_Workbook.xls';
                a.click();
                showToast('Downloaded Nexus5D_GraphRift_Workbook.xls!');
            }, [keywords, sectors, showToast]);

            const handleUploadCsvFile = useCallback((e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const lines = String(reader.result || '').split(/\r?\n/).filter(Boolean);
                    const imported = [];
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                        if (cols.length < 2 || !cols[1]) continue;
                        const sec = sectors.find(s => s.name.toLowerCase().includes((cols[0] || '').toLowerCase())) || sectors[0];
                        imported.push({
                            id: `csv_${Date.now()}_${i}`,
                            sectorId: sec.id,
                            name: cols[1],
                            entityType: 'Trend',
                            surfaceForms: cols[2] ? cols[2].split(/[;|]/).map(s => s.trim()) : [cols[1].toLowerCase()],
                            entities: ['CSV Import'],
                            deltaPct: cols[3] || '+185.0%',
                            deltaNum: parseFloat(cols[3]) || 185,
                            baseline30d: 1000,
                            currentVol: 24000,
                            mentions24h: 4100,
                            narrativeStep: 6,
                            bridgeCount: 2,
                            bridgeStrength: 0.82,
                            sparkline: [20, 35, 50, 65, 78, 88, 95],
                            fromSheet: true,
                            articles: [{ id: `art_csv_${Date.now()}_${i}`, title: `CSV Synced: ${cols[1]}`, source: 'CSV Import', url: '#', time: 'Synced', bridgeRelevance: 89 }]
                        });
                    }
                    if (imported.length > 0) {
                        setKeywords(prev => [...imported, ...prev]);
                        showToast(`Imported ${imported.length} molecules from CSV!`);
                    }
                };
                reader.readAsText(file);
            }, [sectors, showToast]);

            const selectedKeyword = keywords.find(k => k.id === selectedKeywordId) || keywords[0];

            return html`
                <div className="w-screen h-screen relative overflow-hidden">
                    <!-- Full-Screen 100vw x 100vh Three.js 5D Molecular Graph + RiftBot -->
                    <${WebGL5DStage}
                        sectors=${sectors}
                        keywords=${keywords}
                        jaggardPairs=${jaggardPairs}
                        viewMode=${viewMode}
                        orbitsEnabled=${orbitsEnabled}
                        selectedSectorId=${selectedSectorId}
                        selectedKeywordId=${selectedKeywordId}
                        expandedSectors=${expandedSectors}
                        burstKeywords=${burstKeywords}
                        riftBotMode=${riftBotMode}
                        riftBotVisible=${riftBotVisible}
                        botCommandReq=${botCommandReq}
                        cameraFocusReq=${cameraFocusReq}
                        rippleRequest=${rippleRequest}
                        cameraResetTick=${cameraResetTick}
                        onSelectSector=${handleSelectSector}
                        onToggleSectorBurst=${handleToggleSectorBurst}
                        onSelectAndBurstKeyword=${handleSelectAndBurstKeyword}
                        onUpdateBotTelemetry=${setBotTelemetry}
                        onBotStateChange=${(nextMode, msg) => {
                            setRiftBotMode(nextMode);
                            if (msg) setBotSpeech(msg);
                        }}
                    />

                    <!-- Dedicated Full-Screen Jaggard Cards Main View Screen -->
                    <${JaggardMainViewScreen}
                        isOpen=${mainScreen === 'jaggard'}
                        focusedBridgeId=${focusedBridgeId}
                        sectors=${sectors}
                        keywords=${keywords}
                        jaggardPairs=${jaggardPairs}
                        onBackTo3D=${() => setMainScreen('graph3d')}
                        onPinBridge=${handlePinBridge}
                        onDeleteBridge=${(id) => setJaggardPairs(prev => prev.filter(j => j.id !== id))}
                        onInspectBridgeIn3D=${handleInspectBridgeIn3D}
                        onInspectKeywordIn3D=${(kwId) => handleSelectAndBurstKeyword(kwId, false, true)}
                    />

                    <!-- Collapsible HUD Layer (Toggle via H key) -->
                    ${hudHidden ? html`
                        <div className="fixed top-3 right-3 z-40 flex items-center gap-2">
                            <button onClick=${() => setOrbitsEnabled(p => !p)} className="glass-hud px-3 py-1.5 rounded-xl text-xs font-semibold text-emerald-200 border border-emerald-400/40">
                                ${orbitsEnabled ? '⟳ Orbits: ON' : '⏸ Orbits: PAUSE'}
                            </button>
                            <button onClick=${toggleFullscreen} className="glass-hud px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-200 border border-indigo-400/40">
                                ${isFullscreen ? '⤓ Exit (F)' : '⛶ Full (F)'}
                            </button>
                            <button onClick=${() => setHudHidden(false)} className="glass-hud px-3 py-1.5 rounded-xl text-xs font-semibold text-cyan-200 border border-cyan-400/50">
                                👁 Show HUD (H)
                            </button>
                        </div>
                    ` : html`
                        <${Fragment}>
                            <${TopCommandHeader}
                                sectorsCount=${sectors.length}
                                clustersCount=${keywords.length}
                                stageSubtitle=${stageSubtitle}
                                keywords=${keywords}
                                sectors=${sectors}
                                mainScreen=${mainScreen}
                                viewMode=${viewMode}
                                orbitsEnabled=${orbitsEnabled}
                                isFullscreen=${isFullscreen}
                                onToggleLeftPanel=${() => setLeftPanelOpen(p => !p)}
                                onToggleRightPanel=${() => setRightDrawerOpen(p => !p)}
                                onSwitchMainScreen=${(scr) => setMainScreen(scr)}
                                onToggleViewMode=${() => setViewMode(p => p === 'orbiting100' ? 'sectorOnly' : 'orbiting100')}
                                onToggleOrbits=${() => setOrbitsEnabled(p => !p)}
                                onExpandAll100=${() => {
                                    setMainScreen('graph3d');
                                    setViewMode('orbiting100');
                                    setExpandedSectors(new Set(sectors.map(s => s.id)));
                                    setStageSubtitle('All 20 Sectors Expanded — 100 Revolving 5D Molecules & Emerald Narrative Chains');
                                }}
                                onResetOverview=${() => {
                                    setMainScreen('graph3d');
                                    setViewMode('sectorOnly');
                                    setSelectedSectorId(null);
                                    setExpandedSectors(new Set());
                                    setBurstKeywords(new Set());
                                    setCameraResetTick(t => t + 1);
                                    setStageSubtitle('Sector Overview (20 Macro Sectors) • Click: Linked Bridges • Dbl-Click: Burst Molecules');
                                }}
                                onToggleFullscreen=${toggleFullscreen}
                                onToggleHud=${() => setHudHidden(true)}
                                onSelectKeyword=${handleSelectAndBurstKeyword}
                            />

                            ${mainScreen === 'graph3d' && html`
                                <${Fragment}>
                                    <${LeftCommandSidebar}
                                        isOpen=${leftPanelOpen}
                                        activeTab=${activeLeftTab}
                                        setActiveTab=${setActiveLeftTab}
                                        onClose=${() => setLeftPanelOpen(false)}
                                        sectors=${sectors}
                                        keywords=${keywords}
                                        jaggardPairs=${jaggardPairs}
                                        selectedSectorId=${selectedSectorId}
                                        selectedKeywordId=${selectedKeywordId}
                                        expandedSectors=${expandedSectors}
                                        onSelectSector=${handleSelectSector}
                                        onToggleSectorBurst=${handleToggleSectorBurst}
                                        onSelectKeyword=${handleSelectAndBurstKeyword}
                                        onDeleteArticle=${handleDeleteArticle}
                                        onOpenJaggardMainView=${(bridgeId) => { setFocusedBridgeId(bridgeId); setMainScreen('jaggard'); }}
                                        onPinBridge=${handlePinBridge}
                                        onDeleteJaggard=${(id) => setJaggardPairs(prev => prev.filter(j => j.id !== id))}
                                        onFetchRssPreset=${handleFetchRssPreset}
                                        onIngestCustomRss=${handleIngestCustomRss}
                                        onAddKeyword=${handleAddKeyword}
                                        onAddManualArticle=${handleAddManualArticle}
                                        onExportExcel=${handleExportExcel}
                                        onUploadCsvFile=${handleUploadCsvFile}
                                        onCopyToast=${showToast}
                                    />

                                    <${RightMoleculeInspector}
                                        isOpen=${rightDrawerOpen}
                                        selectedKeyword=${selectedKeyword}
                                        keywords=${keywords}
                                        sectors=${sectors}
                                        jaggardPairs=${jaggardPairs}
                                        burstKeywords=${burstKeywords}
                                        onClose=${() => setRightDrawerOpen(false)}
                                        onBurstKeyword=${handleSelectAndBurstKeyword}
                                        onSelectKeyword=${handleSelectAndBurstKeyword}
                                        onConstructWithBot=${(kwId) => {
                                            setRiftBotVisible(true);
                                            setRiftBotMode('constructing');
                                            setBotCommandReq({ mode: 'constructing', keywordId: kwId, ts: Date.now() });
                                            const kw = keywords.find(k => k.id === kwId);
                                            setBotSpeech(`RiftBot locked onto "${kw?.name}"! Firing construction laser & welding sparks!`);
                                        }}
                                        onOpenJaggardCard=${(bridgeId) => { setFocusedBridgeId(bridgeId); setMainScreen('jaggard'); }}
                                    />

                                    <${RiftBotCompanionCard}
                                        botMode=${riftBotMode}
                                        botVisible=${riftBotVisible}
                                        botTelemetry=${botTelemetry}
                                        speechText=${botSpeech}
                                        keywords=${keywords}
                                        sectors=${sectors}
                                        jaggardPairs=${jaggardPairs}
                                        onWaveHi=${() => {
                                            setRiftBotVisible(true);
                                            setRiftBotMode('greeting');
                                            setBotCommandReq({ mode: 'greeting', ts: Date.now() });
                                            setBotSpeech('Hi! Ready to construct 5D neural vertices!');
                                        }}
                                        onConstructActive=${() => {
                                            setRiftBotVisible(true);
                                            setRiftBotMode('constructing');
                                            setBotCommandReq({ mode: 'constructing', keywordId: selectedKeywordId, sectorId: selectedSectorId, ts: Date.now() });
                                            setBotSpeech(`Deploying plasma welder to "${selectedKeyword?.name || 'active node'}"!`);
                                        }}
                                        onPatrol=${() => {
                                            setRiftBotVisible(true);
                                            setRiftBotMode('patrolling');
                                            setBotCommandReq({ mode: 'patrolling', ts: Date.now() });
                                            setBotSpeech('Autonomous 5D vertex patrol engaged! Inspecting random molecules & bridges.');
                                        }}
                                        onDock=${() => {
                                            setRiftBotVisible(true);
                                            setRiftBotMode('docked');
                                            setBotCommandReq({ mode: 'docked', ts: Date.now() });
                                            setBotSpeech('Docked in idle hover mode. Click Construct Node or Patrol anytime!');
                                        }}
                                        onToggleVisible=${() => setRiftBotVisible(p => !p)}
                                    />
                                <//>
                            `}
                        <//>
                    `}

                    <!-- Toast Notification -->
                    ${toastMsg && html`
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 glass-hud px-4 py-2 rounded-full border border-cyan-400/50 text-xs font-medium text-cyan-100 shadow-2xl">
                            ${toastMsg}
                        </div>
                    `}
                </div>
            `;
        }

        function mountNexus5D() {
            const container = document.getElementById('root');
            if (!container || container.dataset.mounted === '1') return;
            container.dataset.mounted = '1';
            const root = ReactDOM.createRoot(container);
            root.render(html`<${ErrorBoundary}><${App} /><//>`);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            mountNexus5D();
        } else {
            window.addEventListener('DOMContentLoaded', mountNexus5D);
            window.addEventListener('load', mountNexus5D);
        }
    </script>
</body>
</html>
